<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Laundry Bubbles · Washer</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>
  <main class="app-shell">
    <header class="app-header">
      <div class="brand-lockup">
        <div class="brand-mark"></div>
        <div>
          <div class="brand-text-main">Laundry Bubbles</div>
          <div class="brand-text-sub">Washer Dashboard</div>
        </div>
      </div>
      <div style="display:flex;align-items:center;gap:10px;">
        <a href="onboarding-washer.html" class="secondary-btn" style="text-decoration:none;font-size:0.78rem;padding:6px 12px;">Earn tips</a>
        <button class="secondary-btn" id="logoutBtn">Log out</button>
      </div>
    </header>

    <section class="two-column">
      <div class="panel">
        <h2>Your washer profile</h2>
        <form id="washerProfileForm" class="stack-form">
          <label>Name</label>
          <input id="washerName" type="text" required>
          <label>Phone</label>
          <input id="washerPhone" type="text">
          <label>Apple Pay handle</label>
          <input id="washerApplePay" type="text">
          <label>Cash App $tag</label>
          <input id="washerCashApp" type="text">
          <label>PayPal email</label>
          <input id="washerPaypal" type="email">
          <label>Service area (e.g., "Atlanta, GA 5-mile radius")</label>
          <input id="washerServiceArea" type="text">
          <label>Skills (e.g., "Delicates, dry clean, same-day")</label>
          <input id="washerSkills" type="text">
          <label>Availability (e.g., "Mon-Fri 9am-5pm")</label>
          <input id="washerAvailability" type="text">
          <div style="display:flex;align-items:center;gap:8px;margin-top:4px;">
            <input id="washerAvailable" type="checkbox" style="width:auto;border-radius:4px;">
            <label style="margin-bottom:0;text-transform:none;letter-spacing:0;">Available for jobs now</label>
          </div>
          <button class="primary-btn" type="submit">Save profile</button>
          <p id="profileMsg" class="tiny-muted" style="text-align:center;min-height:16px;"></p>
        </form>
      </div>

      <div class="panel">
        <h2>Available requests near you</h2>
        <button class="secondary-btn" id="refreshRequestsBtn" style="margin-bottom:10px;width:100%;">Refresh requests</button>
        <div id="incomingOrders" class="list">
          <div class="list-item">Loading requests…</div>
        </div>
      </div>
    </section>

    <section class="panel" style="margin-top:20px;">
      <h2>Your active orders</h2>
      <div id="activeOrders" class="list">
        <div class="list-item">Loading active orders…</div>
      </div>
    </section>

    <section class="panel" style="margin-top:20px;">
      <h2>Live Map — Nearby Requests</h2>
      <p class="tiny-muted" style="margin-bottom:8px;">Updates every 30 seconds. Orange dots = client requests.</p>
      <div id="washerMap" class="map-container"></div>
    </section>
  </main>

  <script type="module" src="js/washer-app.js"></script>
</body>
</html>
